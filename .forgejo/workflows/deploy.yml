name: Build, push and deploy

# Typecheck, lint and tests run inside the image build (the Dockerfile's `check`
# stage), so a commit that fails them never produces an image to deploy.
#
# Plain docker and git, no third-party actions. Needs on the runner:
# - a label matching `runs-on`;
# - Docker access for job containers (e.g. `container.docker_host: automount`
#   in the forgejo-runner config), since the image is built with the host's daemon.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    container:
      # Alpine with the Docker CLI, buildx and git.
      image: docker:cli

    steps:
      - name: Check out
        run: |
          host="${FORGEJO_SERVER_URL#*://}"
          git init --quiet .
          git fetch --quiet --depth 1 \
            "https://oauth2:${FORGEJO_TOKEN}@${host}/${FORGEJO_REPOSITORY}.git" "${FORGEJO_SHA}"
          git checkout --quiet FETCH_HEAD

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "${FORGEJO_SERVER_URL#*://}" \
            --username "$REGISTRY_USER" --password-stdin

      - name: Build and push
        run: |
          image="${FORGEJO_SERVER_URL#*://}/$(echo "$FORGEJO_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # The host daemon's default builder: its layer cache stays on the host
          # between runs, so nothing but the image itself is uploaded (Cloudflare
          # in front of the registry rejects uploads over 100 MB).
          docker buildx build . \
            --builder default \
            --platform linux/arm64 \
            --tag "$image:$FORGEJO_SHA" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY" \
            --label "org.opencontainers.image.revision=$FORGEJO_SHA" \
            --push

      - name: Deploy GZM GTFS-RT proxy worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            WORKER_SOURCE="$(cat tools/gzm-proxy/worker.js)" \
              docker run --rm -i \
                -e CF_ACCOUNT_ID \
                -e CF_API_TOKEN \
                -e WORKER_SOURCE \
                node:26-slim node - < tools/gzm-proxy/deploy.mjs
          fi

  deploy:
    runs-on: docker
    needs: build-and-push
    container:
      image: docker:cli

    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        # BusyBox wget: no curl in the image.
        run: |
          wget --quiet --output-document=- --post-data='' \
            --header="Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
